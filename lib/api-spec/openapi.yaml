openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Fraud Detection System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: transactions
    description: Transaction management
  - name: alerts
    description: Fraud alerts
  - name: analytics
    description: Analytics and reporting
  - name: users
    description: User management
  - name: rules
    description: Fraud rule management
  - name: cases
    description: Case management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Account created and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fraud/check:
    post:
      operationId: checkFraud
      tags: [auth]
      summary: Check a transaction for fraud without persisting
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FraudCheckBody"
      responses:
        "200":
          description: Fraud analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudCheckResult"

  /fraud/batch:
    post:
      operationId: batchCheckFraud
      tags: [auth]
      summary: Run fraud checks on multiple transactions at once
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchFraudCheckBody"
      responses:
        "200":
          description: Batch fraud analysis results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchFraudCheckResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List all fraud cases
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, under_review, resolved, dismissed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: assignedTo
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FraudCase"
    post:
      operationId: createCase
      tags: [cases]
      summary: Create a new case
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseBody"
      responses:
        "201":
          description: Case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudCase"

  /cases/{id}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get a single case
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Case found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudCase"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCase
      tags: [cases]
      summary: Update a case
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaseBody"
      responses:
        "200":
          description: Case updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudCase"
    delete:
      operationId: deleteCase
      tags: [cases]
      summary: Delete a case
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Case deleted

  /cases/{id}/notes:
    get:
      operationId: listCaseNotes
      tags: [cases]
      summary: List notes for a case
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notes list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseNote"
    post:
      operationId: addCaseNote
      tags: [cases]
      summary: Add a note to a case
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddNoteBody"
      responses:
        "201":
          description: Note added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseNote"

  /rules:
    get:
      operationId: listRules
      tags: [rules]
      summary: List all fraud rules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FraudRule"
    post:
      operationId: createRule
      tags: [rules]
      summary: Create a new fraud rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleBody"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudRule"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rules/{id}:
    patch:
      operationId: updateRule
      tags: [rules]
      summary: Update a fraud rule
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRuleBody"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudRule"
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRule
      tags: [rules]
      summary: Delete a fraud rule
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Rule deleted
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rules/{id}/toggle:
    post:
      operationId: toggleRule
      tags: [rules]
      summary: Toggle a rule enabled/disabled
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rule toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudRule"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions with optional filters
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, flagged, blocked]
        - name: riskLevel
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"

    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Submit a new transaction for fraud analysis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionBody"
      responses:
        "201":
          description: Transaction created and analyzed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionWithAnalysis"

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a single transaction by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionWithAnalysis"

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List fraud alerts
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: severity
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: resolved
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of fraud alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"

  /alerts/{id}/resolve:
    patch:
      operationId: resolveAlert
      tags: [alerts]
      summary: Mark an alert as resolved
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveAlertBody"
      responses:
        "200":
          description: Alert resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudAlert"

  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Dashboard summary stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /analytics/fraud-trend:
    get:
      operationId: getFraudTrend
      tags: [analytics]
      summary: Fraud trend over the last 30 days (daily counts)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Daily fraud trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyTrendPoint"

  /analytics/risk-distribution:
    get:
      operationId: getRiskDistribution
      tags: [analytics]
      summary: Distribution of transactions by risk level
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Risk distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskDistributionPoint"

  /analytics/top-risk-users:
    get:
      operationId: getTopRiskUsers
      tags: [analytics]
      summary: Users with highest risk scores
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Top risk users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskUserSummary"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    FraudCase:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, under_review, resolved, dismissed]
        priority:
          type: string
          enum: [low, medium, high, critical]
        alertId:
          type: integer
          nullable: true
        transactionRef:
          type: string
          nullable: true
        merchantName:
          type: string
          nullable: true
        amount:
          type: number
          nullable: true
        location:
          type: string
          nullable: true
        assignedTo:
          type: integer
          nullable: true
        assigneeName:
          type: string
          nullable: true
        createdBy:
          type: integer
          nullable: true
        noteCount:
          type: integer
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
        resolvedAt:
          type: string
          nullable: true
      required:
        - id
        - title
        - status
        - priority
        - createdAt
        - updatedAt

    CaseNote:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
        content:
          type: string
        createdBy:
          type: integer
          nullable: true
        authorName:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - caseId
        - content
        - createdAt

    CreateCaseBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
          default: medium
        alertId:
          type: integer
        transactionRef:
          type: string
        merchantName:
          type: string
        amount:
          type: number
        location:
          type: string
        assignedTo:
          type: integer
      required:
        - title

    UpdateCaseBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, under_review, resolved, dismissed]
        priority:
          type: string
          enum: [low, medium, high, critical]
        assignedTo:
          type: integer
          nullable: true

    AddNoteBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    FraudRuleCondition:
      type: object
      properties:
        field:
          type: string
          enum: [amount, merchantCategory, location, fraudScore, riskLevel]
        operator:
          type: string
          enum: [gt, lt, gte, lte, equals, not_equals, contains, in]
        value:
          oneOf:
            - type: number
            - type: string
            - type: array
              items:
                type: string
      required:
        - field
        - operator
        - value

    FraudRule:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/FraudRuleCondition"
        conditionLogic:
          type: string
          enum: [AND, OR]
        action:
          type: string
          enum: [approve, flag, block]
        priority:
          type: integer
        enabled:
          type: boolean
        createdBy:
          type: integer
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - conditions
        - conditionLogic
        - action
        - priority
        - enabled
        - createdAt
        - updatedAt

    CreateRuleBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/FraudRuleCondition"
          minItems: 1
        conditionLogic:
          type: string
          enum: [AND, OR]
          default: AND
        action:
          type: string
          enum: [approve, flag, block]
        priority:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        enabled:
          type: boolean
          default: true
      required:
        - name
        - conditions
        - action

    UpdateRuleBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/FraudRuleCondition"
        conditionLogic:
          type: string
          enum: [AND, OR]
        action:
          type: string
          enum: [approve, flag, block]
        priority:
          type: integer
          minimum: 1
          maximum: 1000
        enabled:
          type: boolean

    RegisterBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required:
        - name
        - email
        - password

    FraudCheckBody:
      type: object
      properties:
        amount:
          type: number
        merchantName:
          type: string
        merchantCategory:
          type: string
        location:
          type: string
        deviceId:
          type: string
      required:
        - amount
        - merchantName
        - location

    BatchFraudCheckBody:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/FraudCheckBody"
          minItems: 1
          maxItems: 500
      required:
        - transactions

    BatchFraudCheckResultItem:
      type: object
      properties:
        index:
          type: integer
        merchantName:
          type: string
        merchantCategory:
          type: string
        amount:
          type: number
        location:
          type: string
        fraudScore:
          type: number
        anomalyScore:
          type: number
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [approved, flagged, blocked]
        severity:
          type: string
        reason:
          type: string
        signals:
          type: array
          items:
            type: string
      required:
        - index
        - merchantName
        - merchantCategory
        - amount
        - location
        - fraudScore
        - anomalyScore
        - riskLevel
        - status
        - severity
        - reason
        - signals

    BatchFraudCheckResult:
      type: object
      properties:
        total:
          type: integer
        approved:
          type: integer
        flagged:
          type: integer
        blocked:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/BatchFraudCheckResultItem"
      required:
        - total
        - approved
        - flagged
        - blocked
        - results

    FraudCheckResult:
      type: object
      properties:
        fraudScore:
          type: number
        anomalyScore:
          type: number
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [approved, flagged, blocked]
        severity:
          type: string
          enum: [low, medium, high, critical]
        reason:
          type: string
        signals:
          type: array
          items:
            type: string
      required:
        - fraudScore
        - anomalyScore
        - riskLevel
        - status
        - severity
        - reason
        - signals

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, analyst, user]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - role
        - createdAt

    CreateTransactionBody:
      type: object
      properties:
        userId:
          type: integer
        amount:
          type: number
        currency:
          type: string
          default: USD
        merchantName:
          type: string
        merchantCategory:
          type: string
        location:
          type: string
        deviceId:
          type: string
        ipAddress:
          type: string
      required:
        - userId
        - amount
        - merchantName
        - location

    Transaction:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        amount:
          type: number
        currency:
          type: string
        merchantName:
          type: string
        merchantCategory:
          type: string
        location:
          type: string
        deviceId:
          type: string
        ipAddress:
          type: string
        status:
          type: string
          enum: [pending, approved, flagged, blocked]
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        fraudScore:
          type: number
        anomalyScore:
          type: number
        createdAt:
          type: string
          format: date-time
        userName:
          type: string
      required:
        - id
        - userId
        - amount
        - currency
        - merchantName
        - location
        - status
        - riskLevel
        - fraudScore
        - anomalyScore
        - createdAt

    TransactionWithAnalysis:
      allOf:
        - $ref: "#/components/schemas/Transaction"
        - type: object
          properties:
            alert:
              $ref: "#/components/schemas/FraudAlert"

    TransactionListResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - transactions
        - total
        - limit
        - offset

    FraudAlert:
      type: object
      properties:
        id:
          type: integer
        transactionId:
          type: integer
        userId:
          type: integer
        severity:
          type: string
